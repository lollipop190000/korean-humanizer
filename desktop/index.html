<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Korean Humanizer</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#172b38;background:#f4f7fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:42px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:30px}.brand{font-size:13px;color:#126578;font-weight:750;letter-spacing:.08em}h1{font-size:32px;letter-spacing:-.04em;margin:10px 0}p{line-height:1.7;margin:8px 0;color:#526675}.tag{border:1px solid #c9dfdb;background:#e9f5ef;color:#27674c;border-radius:999px;padding:9px 14px;white-space:nowrap;font-size:13px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border:1px solid #dbe4ea;border-radius:18px;overflow:hidden;box-shadow:0 5px 24px #152f4810}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid #e8eef2}label,h2{font-size:16px;font-weight:700;margin:0}.sub{font-size:12px;color:#788b98}textarea{display:block;resize:vertical;border:0;width:100%;min-height:360px;padding:22px;font:16px/1.9 inherit;line-height:1.9;font-family:inherit;font-size:16px;outline-offset:-4px;background:white;color:#172b38}textarea:focus-visible{outline:2px solid #16778d}button{font:inherit;cursor:pointer;border:0;border-radius:10px;font-weight:650}.small{background:#eef4f7;color:#24556a;padding:8px 12px;font-size:13px}.primary{background:#126b82;color:white;padding:14px 28px;min-width:160px}.primary:hover{background:#09566c}button:disabled{opacity:.5;cursor:default}.actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:20px}.status{font-size:14px;flex:1;min-width:230px}.status.error{color:#a33e29}.notes{font-size:13px;margin-top:26px;border-top:1px solid #dbe4ea;padding-top:18px}.checks{font-size:13px;color:#765a1b;padding:12px 20px;background:#fff9e9;border-top:1px solid #f0e6c7}.hidden{display:none}.spin{display:inline-block;width:12px;height:12px;border:2px solid #b8d2dc;border-top-color:#126b82;border-radius:50%;animation:spin 1s linear infinite;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:720px){main{padding:24px 16px}header{display:block}.tag{display:inline-block;margin-top:8px}h1{font-size:27px}.panels{grid-template-columns:1fr}textarea{min-height:250px}.primary{width:100%}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style></head><body><main>
<header><div><div class="brand">KOREAN HUMANIZER</div><h1>뜻은 그대로, 문장은 자연스럽게.</h1><p>글을 붙여 넣고 다듬어 보세요. 내 컴퓨터에서 처리합니다.</p></div><span class="tag">학습 모델 · nikl-practical-001</span></header>
<div class="panels"><section class="panel"><div class="bar"><label for="input">원래 글</label><span id="count" class="sub">0자</span></div><textarea id="input" maxlength="10000" placeholder="여기에 다듬을 글을 입력하거나 붙여 넣으세요.&#10;처음에는 짧은 문단으로 시작해 보세요."></textarea></section>
<section class="panel"><div class="bar"><h2><label for="output">다듬은 글</label></h2><button id="copy" class="small" disabled>결과 복사</button></div><textarea id="output" readonly placeholder="다듬은 결과가 여기에 나타납니다."></textarea><div id="checks" class="checks hidden"></div></section></div>
<div class="actions"><button id="submit" class="primary">글 다듬기</button><div id="status" class="status" role="status" aria-live="polite">글을 입력하고 다듬기를 눌러 주세요.</div></div>
<div class="notes"><p>처음 다듬을 때 모델 파일을 내려받습니다. 시간이 걸릴 수 있으니 실행 창을 열어 두세요. 이후에는 불러온 모델을 재사용합니다.</p><p>숫자·인용·의미가 유지됐는지 결과를 읽어 확인해 주세요. 긴 글은 문단으로 나눠 넣으면 좋아요. 입력과 결과를 서버로 보내거나 파일에 자동 저장하지 않습니다.</p><p id="device"></p></div>
</main><script>
const token="__LOCAL_TOKEN__";
const input=document.querySelector('#input'),output=document.querySelector('#output'),submit=document.querySelector('#submit'),status=document.querySelector('#status'),copy=document.querySelector('#copy'),checks=document.querySelector('#checks');
let timer=null;
input.addEventListener('input',()=>document.querySelector('#count').textContent=input.value.length+'자');
function message(text,error=false){status.textContent=text;status.classList.toggle('error',error)}
async function poll(){try{const response=await fetch('/api/status');if(!response.ok)throw Error();const data=await response.json();message(data.message||'',data.status==='error');if(data.status==='busy'){submit.disabled=true;timer=setTimeout(poll,800);return}submit.disabled=false;if(data.status==='done'){output.value=data.result.output;copy.disabled=!output.value;const warnings=[];if(data.result.finish_reason==='length')warnings.push('출력 길이 한도에 도달했습니다. 잘린 부분이 없는지 확인하고 입력을 짧게 나눠 주세요.');if(!data.result.checks.mechanical_pass)warnings.push('숫자·인용 등 보존 검사에서 차이가 발견됐습니다. 원문과 비교해 주세요.');checks.textContent=warnings.join(' ');checks.classList.toggle('hidden',!warnings.length);document.querySelector('#device').textContent=data.result.device==='cuda'?(data.result.quantization==='nf4'?'NVIDIA GPU · 메모리 절약 모드':'NVIDIA GPU로 실행 중'):'내 컴퓨터에서 실행 중';}}catch{submit.disabled=false;message('앱 연결이 끊겼습니다. 실행 창을 확인하거나 앱을 다시 실행해 주세요.',true)}}
submit.addEventListener('click',async()=>{if(!input.value.trim()){message('다듬을 글을 먼저 입력해 주세요.',true);input.focus();return}submit.disabled=true;copy.disabled=true;output.value='';checks.classList.add('hidden');message('준비하고 있습니다…');try{const response=await fetch('/api/rewrite',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':token},body:JSON.stringify({text:input.value})});const data=await response.json();if(!response.ok){submit.disabled=false;message(data.error||'요청을 처리하지 못했습니다.',true);return}clearTimeout(timer);poll()}catch{submit.disabled=false;message('앱에 연결할 수 없습니다. 실행 창을 확인해 주세요.',true)}});
copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(output.value);copy.textContent='복사했어요';setTimeout(()=>copy.textContent='결과 복사',1600)}catch{output.focus();output.select();message('결과가 선택됐습니다. Ctrl+C로 복사해 주세요.')}});
poll();
</script></body></html>
